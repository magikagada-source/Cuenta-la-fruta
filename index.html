<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cuenta la fruta</title>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#2d0b4e;--card:rgba(24,6,44,.72);--gold:#ffd23f;--cyan:#5cf2ff;--pink:#ff2a6d;--ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Fredoka",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
h1,h2,button,#fn,#tm{font-family:"Titan One","Fredoka",system-ui,sans-serif;font-weight:400}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:5}
#card{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:6px 16px}
#card{max-width:min(94vw,440px)}#q{font-size:15px;line-height:1.3;text-align:center}#opts{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-width:min(94vw,440px)}#opts div{font-size:13px;line-height:1.2;border-radius:10px;padding:4px 8px;color:#25093f;font-weight:700}
#bar{display:flex;gap:10px;font-size:15px}
#bar span{background:var(--card);border-radius:10px;padding:3px 12px}
#tm{color:var(--cyan);min-width:2.2em;text-align:center}
#ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,0,24,.78);padding:16px}
#ov.off{display:none}
#bx{max-width:360px;text-align:center;background:linear-gradient(#4a1a80,#1d0a3a);border:4px solid var(--gold);border-radius:24px;padding:22px}
h1{margin:0;font-size:38px;color:var(--gold);text-shadow:0 4px 0 #000}
h2{margin:4px 0 12px;font-size:21px;color:var(--cyan)}
#t3{font-size:15px;line-height:1.45;margin:0 0 16px;color:#eadcff}
#go{width:100%;padding:14px;font-size:22px;border:0;border-bottom:5px solid #1e9e4b;border-radius:16px;background:#3dff88;color:#25093f;cursor:pointer}
#go:active{transform:translateY(2px)}
#go:focus-visible{outline:3px solid #fff;outline-offset:3px}
#joy,#jb{display:none;position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:6}
#joy{left:22px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4)}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.7)}
#jb{right:22px;width:96px;height:96px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:15px}
@media(pointer:coarse){#joy,#jb{display:block}}
</style>
</head>
<body>
<div id="hud">
<div id="card"><div id="q">Prepárate</div></div><div id="opts"></div>
<div id="bar"><span id="rd">Ronda 0/10</span><span id="tm">0</span><span id="al">1 vivo</span></div><div id="roomHud" style="font-size:12px;background:rgba(24,6,44,.72);padding:3px 10px;border-radius:9px"></div>
</div>
<div id="ov"><div id="bx">
<h1 id="t1">FALL GUYS</h1><h2 id="t2">Preguntas y casillas</h2>
<p id="t3">Entra a una sala o crea una nueva. El primer jugador será el anfitrión. ¡Juega con personas desde cualquier lugar!<br>WASD o flechas para moverte, espacio para saltar.</p>
<input id="playerName" maxlength="16" placeholder="Tu nombre" value="Jugador" style="box-sizing:border-box;width:100%;padding:12px;border-radius:12px;border:2px solid #ffd23f;margin:0 0 9px;font:700 16px Fredoka;text-align:center">
<button id="go">Crear sala online</button>
<div style="display:flex;gap:7px;margin-top:9px">
<input id="roomCode" maxlength="6" placeholder="Código" style="min-width:0;width:50%;padding:12px;border-radius:12px;border:2px solid #5cf2ff;font:700 16px Fredoka;text-align:center;text-transform:uppercase">
<button id="join" style="flex:1;border:0;border-radius:12px;background:#5cf2ff;color:#25093f;font:18px 'Titan One';padding:8px">Unirse</button>
</div>
<p id="onlineStatus" style="font-size:13px;color:#eadcff;margin:10px 0 0">Configura Firebase para activar las salas online.</p>
</div></div>
<div id="joy"><div id="knob"></div></div>
<button id="jb">Saltar</button>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1));
// CONFIGURACIÓN: reemplaza estos valores por los de tu proyecto Firebase.
const firebaseConfig = {
  apiKey: "PEGA_AQUI_TU_API_KEY",
  authDomain: "TU_PROYECTO.firebaseapp.com",
  databaseURL: "https://TU_PROYECTO-default-rtdb.firebaseio.com",
  projectId: "TU_PROYECTO",
  appId: "PEGA_AQUI_TU_APP_ID"
};
let db=null, roomRef=null, roomId=null, playerId=null, isHost=false, onlineReady=false;
let playerName="Jugador", playerOrder=[], lastStateKey="", lastPublish=0, lastStatePublish=0;
const setStatus=t=>{const el=$("onlineStatus");if(el)el.textContent=t};
function firebaseConfigured(){
  return firebaseConfig.apiKey!=="PEGA_AQUI_TU_API_KEY" &&
         firebaseConfig.projectId!=="TU_PROYECTO" &&
         firebaseConfig.databaseURL.includes("firebaseio.com");
}
async function connectFirebase(){
  if(!firebaseConfigured()) throw new Error("Falta configurar Firebase en el archivo HTML.");
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  await firebase.auth().signInAnonymously();
  db=firebase.database(); onlineReady=true;
  playerId=firebase.auth().currentUser.uid;
}
function makeRoomCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
async function createOnlineRoom(){
  try{
    await connectFirebase();
    playerName=($("playerName").value.trim()||"Jugador").slice(0,16);
    roomId=makeRoomCode(); roomRef=db.ref("rooms/"+roomId);
    const snap=await roomRef.once("value");
    if(snap.exists()) return createOnlineRoom();
    isHost=true;
    await roomRef.set({host:playerId,createdAt:firebase.database.ServerValue.TIMESTAMP,
      game:{status:"waiting",round:0,phase:"idle",updatedAt:Date.now()},
      players:{[playerId]:{name:playerName,x:0,z:0,y:0,alive:true,joinedAt:Date.now()}}});
    enterOnlineRoom();
  }catch(e){setStatus("No se pudo conectar: "+e.message)}
}
async function joinOnlineRoom(){
  try{
    await connectFirebase();
    playerName=($("playerName").value.trim()||"Jugador").slice(0,16);
    const code=$("roomCode").value.trim().toUpperCase();
    if(!/^[A-Z0-9]{6}$/.test(code)) throw new Error("Escribe un código de sala de 6 caracteres.");
    roomId=code; roomRef=db.ref("rooms/"+roomId);
    const snap=await roomRef.once("value");
    if(!snap.exists()) throw new Error("No existe esa sala.");
    const data=snap.val();
    if(Object.keys(data.players||{}).length>=8) throw new Error("La sala está completa (máximo 8 jugadores).");
    isHost=data.host===playerId;
    await roomRef.child("players/"+playerId).set({name:playerName,x:0,z:0,y:0,alive:true,joinedAt:Date.now()});
    enterOnlineRoom();
  }catch(e){setStatus("No se pudo entrar: "+e.message)}
}
function enterOnlineRoom(){
  $("roomHud").textContent="Sala "+roomId+" · "+(isHost?"HOST":"JUGADOR");
  $("t1").textContent="SALA "+roomId;
  $("t2").textContent=isHost?"Eres el anfitrión":"Esperando al anfitrión";
  $("t3").textContent=isHost?"Comparte el código "+roomId+". Pulsa Jugar para iniciar la partida.":"Código "+roomId+". Espera a que el anfitrión inicie.";
  $("go").textContent=isHost?"Iniciar partida":"Esperando al host…";
  $("go").disabled=!isHost;
  $("join").disabled=true;
  $("roomCode").disabled=true;
  $("onlineStatus").textContent="Conectado · "+playerName+" · "+roomId;
  $("ov").classList.remove("off");
  roomRef.child("players").on("value",snap=>syncPlayers(snap.val()||{}));
  roomRef.child("game").on("value",snap=>{const st=snap.val();if(st)applyRemoteGameState(st)});
  roomRef.onDisconnect().cancel();
  roomRef.child("players/"+playerId).onDisconnect().remove();
  $("go").onclick=()=>{if(isHost)startGame()};
}
function syncPlayers(players){
  const ids=Object.keys(players).sort((a,b)=>(players[a].joinedAt||0)-(players[b].joinedAt||0));
  playerOrder=ids;
  E.forEach((e,i)=>{e.alive=false;e.mesh.visible=false;e.sh.visible=false});
  const ordered=[playerId,...ids.filter(id=>id!==playerId)];
  ordered.forEach((id,slot)=>{
    const p=players[id];if(!p||slot>=E.length)return;
    const e=E[slot];
    e.name=p.name||"Jugador";e.alive=p.alive!==false;
    if(id!==playerId){e.x=Number(p.x)||0;e.z=Number(p.z)||0;e.y=Number(p.y)||0}
    e.mesh.visible=e.sh.visible=e.alive;
    e.mesh.position.set(e.x,e.y+.3,e.z);
    e.sh.position.set(e.x,.32,e.z);
  });
  hud();
}
function publishPlayer(){
  if(!roomRef||!playerId||!E[0])return;
  const e=E[0];
  roomRef.child("players/"+playerId).update({x:e.x,z:e.z,y:e.y,alive:e.alive});
}
function publishGameState(){
  if(!roomRef||!isHost)return;
  const Q=G.questions&&G.questions[G.round-1];
  roomRef.child("game").update({status:"playing",round:G.round,phase:G.ph,time:G.t,
    question:Q?Q.q:"",options:Q?Q.o:[],tileOk:T.map(t=>!!t.ok),tileSolid:T.map(t=>!!t.solid),
    updatedAt:Date.now()});
}
function applyRemoteGameState(st){
  if(isHost)return;
  if(st.status==="playing"){
    if(G.round!==st.round || lastStateKey!==String(st.round)+st.phase){
      G.round=st.round||G.round;G.ph=st.phase||"idle";G.t=Number(st.time)||0;
      if(st.question)$("q").textContent=st.question;
      if(st.options&&st.options.length){
        $("opts").innerHTML=st.options.map((v,i)=>'<div style="background:'+QC[i]+'">'+
          "ABCD"[i]+") "+v+"</div>").join("");
      }
      (st.tileOk||[]).forEach((v,i)=>{if(T[i]){T[i].ok=!!v;labQ(T[i],"ABCD"[Math.floor(i/8)*2+(i%4>>1)],QC[Math.floor(i/8)*2+(i%4>>1)])}});
      (st.tileSolid||[]).forEach((v,i)=>{if(T[i])T[i].solid=!!v});
      lastStateKey=String(st.round)+st.phase;
      $("ov").classList.add("off");hud();
    } else {G.t=Number(st.time)||G.t}
  } else if(st.status==="waiting"){
    $("t2").textContent="Esperando al anfitrión";
    $("ov").classList.remove("off");
  } else if(st.status==="finished"){
    G.ph="idle";$("t1").textContent="PARTIDA TERMINADA";$("t2").textContent="¡Gracias por jugar!";
    $("t3").textContent="El anfitrión puede crear otra partida."; $("go").disabled=true;$("ov").classList.remove("off");
  }
}

const QC=['#ff7a8a','#6bb6ff','#5fe39a','#ffd23f'];
const QS=[
{q:'Un mapa ubica dos ciudades en A(−4, 2) y B(6, 8). ¿Cuál es el punto medio M para una estación de señal?',o:['M = (1, 5)','M = (2, 10)','M = (5, 3)','M = (10, 6)'],t:60},
{q:'El punto medio de AB es M(3, 4) y A está en (1, 1). ¿Cuáles son las coordenadas de B?',o:['B = (5, 7)','B = (2, 3)','B = (6, 8)','B = (4, 5)'],t:60},

{q:'Una parábola corta el eje X en x₁ = −2 y x₂ = 8. ¿En qué x está su eje de simetría?',o:['x = 3','x = 6','x = 5','x = −5'],t:60},
{q:'La recta 2x + 3y − 12 = 0 corta el eje X en A y el eje Y en B. ¿Cuál es el punto medio de AB?',o:['M = (3, 2)','M = (6, 4)','M = (2, 3)','M = (−3, −2)'],t:60},
{q:'¿Qué representa el tamaño de cada sector en un gráfico circular?',o:['La proporción de cada categoría respecto al total (círculo = 100 % = 360°)','El valor exacto de la categoría, sin importar el total','El cambio de los datos a lo largo del tiempo','El orden alfabético de las categorías'],t:60}];
function labQ(t,s,c){const x=t.ctx;x.fillStyle=c;x.fillRect(0,0,128,128);x.strokeStyle='#fff';x.lineWidth=8;x.strokeRect(4,4,120,120);x.fillStyle='#25093f';x.font='bold 84px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(s,64,70);t.tex.needsUpdate=true}
const sc=new THREE.Scene();sc.background=new THREE.Color(0x2d0b4e);
const cam=new THREE.PerspectiveCamera(45,1,.1,200);
const rn=new THREE.WebGLRenderer({antialias:true});rn.setPixelRatio(Math.min(devicePixelRatio,2));
rn.domElement.style.cssText='position:fixed;inset:0;width:100%;height:100%';document.body.prepend(rn.domElement);
function rs(){const a=innerWidth/innerHeight,k=Math.max(1,.85/a);rn.setSize(innerWidth,innerHeight,false);cam.aspect=a;cam.position.set(0,26*k,20*k);cam.lookAt(0,0,0);cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
sc.add(new THREE.AmbientLight(0xffffff,.75));const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(15,40,20);sc.add(dl);
const slime=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x00ff66,roughness:.1,transparent:true,opacity:.85}));
slime.rotation.x=-Math.PI/2;slime.position.y=-12;sc.add(slime);
// Casillas
const T=[],tg=new THREE.BoxGeometry(3.8,.6,3.8),sm=new THREE.MeshStandardMaterial({color:0xb8a9ff,roughness:.4});
for(let i=0;i<16;i++){const cv=document.createElement('canvas');cv.width=cv.height=128;const tex=new THREE.CanvasTexture(cv);
const top=new THREE.MeshStandardMaterial({map:tex,roughness:.4});const m=new THREE.Mesh(tg,[sm,sm,top,sm,sm,sm]);
const cx=(i%4-1.5)*4,cz=(Math.floor(i/4)-1.5)*4;m.position.set(cx,0,cz);sc.add(m);
T.push({m,top,ctx:cv.getContext('2d'),tex,cx,cz,solid:true,v:0,ok:true})}
function lab(t,s){const x=t.ctx;x.fillStyle='#fff';x.fillRect(0,0,128,128);x.strokeStyle='#8a5cff';x.lineWidth=8;x.strokeRect(4,4,120,120);
x.fillStyle='#3b1368';x.font='bold 84px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(s,64,70);t.tex.needsUpdate=true}
function tileAt(x,z){const c=Math.floor(x/4+2),r=Math.floor(z/4+2);return c>=0&&c<4&&r>=0&&r<4?T[r*4+c]:null}
// Jugadores
const COL=[0xffd23f,0xff2a6d,0x05d9e8,0x00ff66,0x9d00ff,0xff6600,0x4d7cff,0xff9ecb];
function bean(c){const g=new THREE.Group(),M=new THREE.MeshStandardMaterial({color:c,roughness:.35}),W=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.2}),B=new THREE.MeshBasicMaterial({color:0x111111}),S=new THREE.SphereGeometry(1,16,12);
const add=(geo,mat,x,y,z,s)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);if(s)m.scale.set(s[0],s[1],s[2]);g.add(m)};
add(new THREE.CylinderGeometry(.6,.6,.8,16),M,0,1.15,0);add(S,M,0,1.55,0,[.6,.6,.6]);add(S,M,0,.75,0,[.6,.6,.6]);
[-1,1].forEach(s=>{add(S,W,s*.22,1.7,.46,[.2,.27,.14]);add(S,B,s*.22,1.68,.56,[.08,.1,.05]);add(S,M,s*.68,1.05,.05,[.16,.28,.16]);add(S,M,s*.25,.2,.05,[.22,.2,.28])});return g}
const sg=new THREE.CircleGeometry(.7,16),smat=new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.3});
const E=COL.map((c,i)=>{const mesh=bean(c),sh=new THREE.Mesh(sg,smat);sh.rotation.x=-Math.PI/2;sc.add(mesh,sh);return{mesh,sh,x:0,y:0,z:0,vy:0,on:true,alive:true,bot:false,tx:0,tz:0,wait:0}});
const pm=new THREE.Mesh(new THREE.ConeGeometry(.35,.6,8),new THREE.MeshBasicMaterial({color:0x5cf2ff}));pm.rotation.x=Math.PI;pm.position.y=2.9;E[0].mesh.add(pm);
// Frutas
let F=[];
// Estado
const G={ph:'idle',t:0,round:0,tg:0,ans:0},MAXR=10;
function alive(){return E.filter(e=>e.alive).length}
function hud(){$('al').textContent=alive()+' vivos';$('rd').textContent='Ronda '+G.round+'/'+MAXR}
function say(q){$('rd').textContent='Ronda '+G.round+'/'+MAXR+(q?' · '+q:'')}
function kill(e){e.alive=false;e.mesh.visible=false;e.sh.visible=false;hud()}
function startGame(){
 if(roomRef&&!isHost)return;
 G.round=0;G.questions=Array.from({length:10},(_,i)=>QS[i%QS.length]);
 for(let i=G.questions.length-1;i>0;i--){const j=RI(0,i);[G.questions[i],G.questions[j]]=[G.questions[j],G.questions[i]]}
 E.forEach((e,i)=>{e.alive=i===0||playerOrder[i]!==undefined;e.mesh.visible=e.sh.visible=e.alive;e.x=R(-6,6);e.z=R(-6,6);e.y=0;e.vy=0});
 if(roomRef){roomRef.child("players").once("value").then(s=>{const ps=s.val()||{};Object.keys(ps).forEach(id=>roomRef.child("players/"+id).update({alive:true,x:R(-6,6),z:R(-6,6),y:0}));});}
 $('ov').classList.add('off');startRound()
}
function startRound(){G.round++;hud();
T.forEach(t=>{t.solid=true;t.v=0;t.m.position.y=0;t.m.rotation.set(0,0,0);t.top.color.setHex(0xffffff)});
const Q=G.questions[G.round-1],o=Q.o.map((t,i)=>({t,ok:i===0}));for(let i=o.length-1;i>0;i--){const j=RI(0,i);[o[i],o[j]]=[o[j],o[i]]}
G.pt=Q.t;$('q').textContent=Q.q;
$('opts').innerHTML=o.map((x,i)=>'<div style="background:'+QC[i]+'">'+'ABCD'[i]+') '+x.t+'</div>').join('');
T.forEach((t,i)=>{const q=Math.floor(i/8)*2+(i%4>>1);t.ok=o[q].ok;labQ(t,'ABCD'[q],QC[q])});
setPhase('pick',Q.t,'Corre a tu respuesta');publishGameState()}
function setPhase(p,t,q){G.ph=p;G.t=t;say(q);publishGameState()}
function decide(b){const right=Math.random()<Math.max(.45,.88-G.round*.07),pool=T.filter(t=>t.ok===right);
pool.sort((a,c)=>Math.hypot(a.cx-b.x,a.cz-b.z)-Math.hypot(c.cx-b.x,c.cz-b.z));
const t=right?pool[0]:pool[RI(0,pool.length-1)];b.tx=t.cx+R(-1,1);b.tz=t.cz+R(-1,1);b.wait=R(1.5,Math.max(3,G.pt-7))}
function nextPhase(){
if(G.ph==='pick')setPhase('warn',1.3,'¡Cuidado!');
else if(G.ph==='warn'){T.forEach(t=>{if(!t.ok)t.solid=false});setPhase('drop',2.6,'¡Se caen!');publishGameState()}
else if(G.ph==='drop'){if(!E[0].alive)end(false);else if(G.round>=MAXR||alive()===1)end(true);else startRound()}}
function end(win){G.ph='idle';if(roomRef&&isHost)roomRef.child('game').update({status:'finished',phase:'idle',round:G.round});$('t1').textContent=win?'¡CORONA!':'ELIMINADO';$('t2').textContent=win?'Sobreviviste todas las rondas':'Caíste en la ronda '+G.round;
$('t3').textContent=win?'Respondiste mejor que todos. ¿Otra partida?':'Lee con calma y elige bien tu zona. ¿Revancha?';$('go').textContent='Jugar otra vez';$('ov').classList.remove('off')}
// Controles
const K={};let jx=0,jz=0,jump=false;
addEventListener('keydown',e=>{K[e.code]=true;if(e.code==='Space')jump=true;if(/Arrow|Space/.test(e.code))e.preventDefault()});
addEventListener('keyup',e=>K[e.code]=false);
const joy=$('joy'),kn=$('knob');
function mv(e){const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}jx=x;jz=y;kn.style.transform='translate('+x*35+'px,'+y*35+'px)'}
joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);mv(e)};joy.onpointermove=e=>{if(e.buttons||e.pressure)mv(e)};
joy.onpointerup=joy.onpointercancel=()=>{jx=jz=0;kn.style.transform=''};
$('jb').onpointerdown=()=>{jump=true};$('go').onclick=createOnlineRoom;$('join').onclick=joinOnlineRoom;
// Bucle
const clk=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);
if(G.ph!=='idle'){if(!roomRef||isHost)G.t-=dt;$('tm').textContent=Math.max(0,Math.ceil(G.t));if((!roomRef||isHost)&&G.t<=0)nextPhase()}
if(G.ph==='warn')T.forEach(t=>{if(!t.ok)t.top.color.setHex(Math.floor(clk.elapsedTime*8)%2?0x555555:0xffffff)});
F.forEach(f=>{f.d-=dt;if(f.d<=0&&f.m.position.y>f.ty)f.m.position.y=Math.max(f.ty,f.m.position.y-16*dt)});
T.forEach(t=>{if(!t.solid){t.v+=30*dt;t.m.position.y-=t.v*dt;t.m.rotation.x+=dt*.6}});
E.forEach((e,idx)=>{if(!e.alive)return;if(roomRef&&idx>0){e.mesh.position.set(e.x,e.y+.3,e.z);e.sh.position.set(e.x,.32,e.z);return}let dx=0,dz=0,sp=7;
if(!e.bot){if(G.ph!=='idle'){dx=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0)+jx;dz=(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0)+jz;
const l=Math.hypot(dx,dz);if(l>1){dx/=l;dz/=l}if(jump&&e.on){e.vy=9.5;e.on=false}}jump=false}

e.x+=dx*sp*dt;e.z+=dz*sp*dt;if(dx||dz)e.mesh.rotation.y=Math.atan2(dx,dz);
const t=tileAt(e.x,e.z),gr=t&&t.solid;e.vy-=24*dt;e.y+=e.vy*dt;
if(gr&&e.y<=0&&e.vy<=0&&e.y>-.6){e.y=0;e.vy=0;e.on=true}else e.on=false;
if(e.y<-15)kill(e);
e.mesh.position.set(e.x,e.y+.3,e.z);e.sh.position.set(e.x,.32,e.z);e.sh.visible=!!gr&&e.y>-.2});
if(roomRef&&performance.now()-lastPublish>100){lastPublish=performance.now();publishPlayer()}
 if(roomRef&&isHost&&G.ph!=="idle"&&performance.now()-lastStatePublish>500){
   lastStatePublish=performance.now();
   roomRef.child("game").update({time:G.t,phase:G.ph,round:G.round,updatedAt:Date.now()});
 }
 rn.render(sc,cam)}
loop();
</script>
